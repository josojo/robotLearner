[project]
name = "robot-learner"
version = "0.1.0"
description = "A safety-first learning harness for checkpoint-based robot programs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robot Learner contributors" }]
dependencies = [
  "cableties-sim",
  "gymnasium>=1.2,<2",
  "mujoco==3.8.0",
  "openrouter>=1.0,<2",
  "pillow>=10",
  "python-dotenv>=1,<2",
]

[tool.uv.sources]
cableties-sim = { git = "https://github.com/josojo/robo-wiki.git", rev = "7f6f8fe", subdirectory = "cableTies" }

[project.scripts]
robot-learner = "robot_learner.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_learner"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
